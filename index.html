<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Shortener | Nama Brand</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f3f4f6; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="glass max-w-md w-full p-8 rounded-2xl shadow-xl text-center border border-gray-100">
        <!-- Logo / Icon -->
        <div class="bg-blue-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-gray-800 mb-2">Short Link Service</h1>
        <p class="text-gray-500 mb-8 text-sm">Menghubungkan Anda ke tujuan dengan cepat dan aman.</p>

        <!-- Status Box -->
        <div id="status-box" class="py-4 px-6 rounded-lg bg-gray-50 border border-dashed border-gray-300">
            <div id="loading" class="flex flex-col items-center">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mb-3"></div>
                <p class="text-gray-600 font-medium">Mengarahkan Anda...</p>
            </div>
            
            <div id="error" class="hidden">
                <p class="text-red-500 font-semibold italic">Link tidak valid atau sudah kadaluwarsa.</p>
                <a href="/" class="mt-4 inline-block text-blue-600 underline text-sm">Kembali ke Beranda</a>
            </div>
        </div>

        <div class="mt-8 text-xs text-gray-400 uppercase tracking-widest">
            &copy; 2026 Nama Brand
        </div>
    </div>

    <script>
        /**
         * Konfigurasi Link Anda
         * Format: "slug": "url_tujuan"
         */
        const linkDatabase = {
            "web": "https://google.com",
            "promo": "https://shopee.co.id",
            "youtube": "https://youtube.com",
            "portfolio": "https://github.com/username"
        };

        function handleRedirect() {
            // Mengambil slug dari URL (misal: index.html?id=promo)
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('id');

            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');

            if (slug && linkDatabase[slug]) {
                // Beri jeda 1 detik agar terlihat profesional (opsional)
                setTimeout(() => {
                    window.location.href = linkDatabase[slug];
                }, 1000);
            } else {
                loadingEl.classList.add('hidden');
                errorEl.classList.remove('hidden');
            }
        }

        window.onload = handleRedirect;
    </script>
</body>
</html>
